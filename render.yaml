services:
  - type: web
    name: milestoneproof
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m milestoneproof.app
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: FLASK_ENV
        value: production
      - key: OLLAMA_HOST
        value: "http://localhost:11434"
